<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect accounts</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .env { color: #666; font-size: 14px; margin-bottom: 24px; }
  button { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 16px; border-radius: 10px;
           border: 1px solid #ccc; background: #fff; cursor: pointer; text-align: left; }
  button:hover { background: #f4f4f4; }
  button small { display: block; color: #666; }
  #status { margin: 16px 0; min-height: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<h1>Connect accounts</h1>
<div class="env">Plaid environment: <b>{{ENV}}</b></div>

<button onclick="connect(['transactions'])">Connect a bank or credit union<small>e.g. UFCU: balances and transactions</small></button>
<button onclick="connect(['investments'])">Connect a brokerage<small>e.g. Robinhood: holdings and trades</small></button>

<div id="status"></div>
<h3>Connected</h3>
<table id="list"><tr><td>Loading...</td></tr></table>

<script>
const status = document.getElementById('status');

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function connect(products) {
  status.textContent = 'Opening Plaid...';
  try {
    const { link_token } = await post('/api/link_token', { products });
    Plaid.create({
      token: link_token,
      onSuccess: async (public_token, metadata) => {
        status.textContent = 'Saving connection...';
        try {
          await post('/api/exchange', { public_token, products, institution_name: metadata.institution && metadata.institution.name });
          status.textContent = 'Connected ' + (metadata.institution ? metadata.institution.name : '') + '. Run a sync to pull in your data.';
          load();
        } catch (e) { status.textContent = 'Error: ' + e.message; }
      },
      onExit: (err) => { status.textContent = err ? 'Error: ' + (err.display_message || err.error_message) : ''; },
    }).open();
  } catch (e) { status.textContent = 'Error: ' + e.message; }
}

async function load() {
  const rows = await (await fetch('/api/connections')).json();
  const t = document.getElementById('list');
  t.innerHTML = '<tr><th>Institution</th><th>Data</th><th>Last sync</th></tr>' +
    (rows.length ? rows.map(r => `<tr><td>${esc(r.institution_name)}</td><td>${esc(r.products)}</td><td>${esc(r.last_error ? 'error' : (r.last_synced || 'never'))}</td></tr>`).join('')
                 : '<tr><td colspan=3>Nothing connected yet.</td></tr>');
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
load();
</script>
</body>
</html>
